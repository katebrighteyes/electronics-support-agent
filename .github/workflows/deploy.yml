name: AI Service CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =====================================================
  # CI
  # GitHub-hosted Runner에서 코드 검사
  # =====================================================

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall .


  # =====================================================
  # CD
  # 학생 PC Self-hosted Runner에서 H200 배포
  # =====================================================

  deploy:

    needs: test

    runs-on:
      - self-hosted
      - Windows
      - X64
      - h200-agent-deploy

    timeout-minutes: 20

    steps:

      # ----------------------------------------------
      # H200 접속 확인
      # ----------------------------------------------

      - name: Check H200 connection
        shell: powershell

        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 h200 "echo SSH_OK && whoami && hostname"

      # ----------------------------------------------
      # 코드 체크아웃, 압축 및 전송
      # ----------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compress project files
        shell: powershell
        run: |
          tar -cvf deploy.tar .

      - name: Transfer to H200
        shell: powershell
        run: |
          scp -o BatchMode=yes deploy.tar h200:~/deploy.tar

      # ----------------------------------------------
      # H200 배포
      # ----------------------------------------------
      # 1) 기존 컨테이너 제거 (없으면 무시)
      # 2) 배포 디렉터리 초기화 후 새 압축 파일 풀기
      # 3) 학생별 .env (~/llm/.h200-agent-deploy/.env, git에는 없음. 미리 준비 필요:
      #    COMPOSE_PROJECT_NAME / BACKEND_PORT / FRONTEND_PORT / NVIDIA_VISIBLE_DEVICES)
      #    를 배포 디렉터리로 복사
      # 4) docker compose up -d --build 로 재기동
      #    (컨테이너 시작 시 backend가 build_db.py 를 자동 실행하므로,
      #     H200 호스트의 Ollama가 미리 떠 있고 bge-m3 / qwen2.5:14b가 pull 되어
      #     있어야 합니다)

      - name: Deploy Docker containers
        shell: powershell
        run: |
          ssh -o BatchMode=yes h200 "docker rm -f electronics-agent-backend electronics-agent-frontend 2>/dev/null; rm -rf ~/llm/electronics-support-agent && mkdir -p ~/llm/electronics-support-agent && tar -xf ~/deploy.tar -C ~/llm/electronics-support-agent && cp ~/llm/.h200-agent-deploy/.env ~/llm/electronics-support-agent/.env && rm ~/deploy.tar && cd ~/llm/electronics-support-agent && docker compose up -d --build"

      # ---------------------------------------------------
      # 실행 결과 확인
      # ---------------------------------------------------
      - name: Check containers
        shell: powershell

        run: |
          ssh -o BatchMode=yes h200 "cd ~/llm/electronics-support-agent && docker compose ps"
