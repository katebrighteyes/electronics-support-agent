services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: electronics-agent-backend:latest
    container_name: electronics-agent-backend
    ports:
      - "${BACKEND_PORT}:8000"   # 외부 포트를 컨테이너 내부 8000번 포트로 연결
    # 주의: 호스트 폴더를 .:/app 으로 Bind Mount 하지 않습니다. 이미지 빌드 시점에
    # COPY . . 로 코드가 이미 이미지 안에 들어있어 배포 환경에서는 불필요하고,
    # 컨테이너는 root로 실행되어 Bind Mount된 호스트 폴더에 chroma_db를 root
    # 소유로 생성해버려서(=배포 스크립트의 rm -rf가 Permission denied로 실패)
    # 다음 배포를 막는 문제가 있었습니다. chroma_db는 컨테이너 시작 시 항상 새로
    # 만들도록 되어 있어 컨테이너 내부에만 있어도 됩니다.
    environment:
      # 도커 컨테이너에 특정 MIG 조각만 들여보내도록 제한 (H200 서버의 .env에서 설정)
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
      # 컨테이너(bridge network) 안에서는 localhost가 호스트를 가리키지 않으므로,
      # host.docker.internal(아래 extra_hosts)로 호스트의 Ollama 서버에 접근합니다.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      # Linux 호스트에서도 host.docker.internal 이 호스트를 가리키도록 설정
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: electronics-agent-frontend:latest
    container_name: electronics-agent-frontend
    ports:
      - "${FRONTEND_PORT}:8501"  # 외부 포트를 컨테이너 내부 8501번 포트로 연결
    # backend와 동일한 이유로 .:/app Bind Mount를 사용하지 않습니다.
    environment:
      # 컨테이너 간 통신 시 DNS 이름처럼 서비스 이름(backend)을 활용
      - API_URL=http://backend:8000
    depends_on:
      - backend
